<style>
  :root { --paper:#F6F2EA; --ink:#1E2528; --muted:#4A5155; --accent:#9C3F22; }

  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Avenir Next", Avenir, "Helvetica Neue", sans-serif; line-height:1.6; }
  main { max-width:680px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-weight:600; font-size:2rem; margin:0 0 4px; }
  h2 { font-weight:600; font-size:1.15rem; margin:32px 0 8px; padding-top:16px; border-top:1px solid var(--ink); }
  p, li { color:var(--ink); } .muted { color:var(--muted); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
<h1>Hormesis Companion</h1>
<p class="muted">Stress, in the right dose.</p>
<p>A wellness app for iPhone and iPad that suggests small, manageable challenges and tells you when it's a better day to recover. Everything stays on your device.</p>
